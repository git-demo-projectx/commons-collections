# SonarQube Cloud analysis of commons-collections, run by the sonar job in .github/workflows/ci.yml.
sonar.organization=git-demo-projectx
sonar.projectKey=git-demo-projectx_commons-collections
sonar.projectName=commons-collections

sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=8
sonar.java.binaries=target/classes
sonar.java.test.binaries=target/test-classes
sonar.java.libraries=target/dependency/*.jar
sonar.java.test.libraries=target/dependency/*.jar
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Fail the CI job when the quality gate fails, so the factory sees it.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
